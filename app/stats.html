<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angka — NADI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
:root{--bg:#fcfcfb;--card:#fff;--line:#e1e0d9;--ink:#0b0b0b;--dim:#52514e;--muted:#898781;
      --bar:#3987e5;--bar2:#86b6ef;--gold:#a8790f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:20px 16px 60px;
 font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:52em;margin:0 auto}
h1{font-size:24px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--dim);margin-bottom:6px}
input,select{font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px 20px;border-radius:99px;border:0;
 background:var(--gold);color:#fff;cursor:pointer;margin-top:11px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}
.k .n{font-size:30px;font-weight:800;line-height:1.1}
.k .l{font-size:12px;color:var(--dim);margin-top:3px}
.k .s{font-size:11.5px;color:var(--muted);margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:700}
.bar{display:grid;gap:6px}
.bar .r{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:9px;font-size:12.5px}
.bar .r span{color:var(--dim)}
.bar .r u{text-decoration:none;height:11px;border-radius:99px;background:var(--bar);display:block;min-width:3px}
.bar .r b{text-align:right;font-size:12px;color:var(--dim)}
.note{color:var(--muted);font-size:12.5px;line-height:1.6}
.err{color:#c0392b;font-size:14px;margin-top:10px}
.corong{display:grid;gap:9px;margin-top:6px}
.corong .s{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
 background:#f4f7fb;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px}
.corong .s b{font-weight:800}
.corong .pct{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>Angka penggunaan</h1>
  <p class="sub">Peristiwa sahaja — tiada IP, tiada id pengguna, tiada teks catatan.</p>

  <div class="card" id="masuk">
    <label for="k">Kunci</label>
    <input type="password" id="k" placeholder="STATS_KEY" autocomplete="off">
    <label for="h" style="margin-top:12px">Tempoh</label>
    <select id="h"><option value="7">7 hari</option><option value="30" selected>30 hari</option><option value="90">90 hari</option></select>
    <button id="go">Lihat angka</button>
    <div class="err" id="err"></div>
  </div>

  <div id="hasil"></div>
</div>
<script>
const NAMA={buka_app:'Buka app',buka_quiz:'Buka quiz',quiz_mula:'Mula quiz',quiz_habis:'Habis quiz',
 sunyi_buka:'Buka Catatan Sunyi',sunyi_catat:'Catat kebaikan',sunyi_minggu:'Refleksi mingguan',report:'Report malam'};
const esc=t=>{const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;};
const pct=(a,b)=> b>0? Math.round(a/b*100)+'%' : '—';

document.getElementById('go').onclick=async()=>{
  const k=document.getElementById('k').value.trim(), h=document.getElementById('h').value;
  const err=document.getElementById('err'); err.textContent='';
  if(!k){ err.textContent='Masukkan kunci dulu.'; return; }
  try{
    const r=await fetch(`/api/kira?kunci=${encodeURIComponent(k)}&hari=${h}`);
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||('Ralat '+r.status));
    try{ sessionStorage.setItem('bob.stats',k); }catch(e){}
    lukis(j);
  }catch(e){ err.textContent=e.message; }
};
try{ const k=sessionStorage.getItem('bob.stats'); if(k){ document.getElementById('k').value=k; } }catch(e){}

function lukis(j){
  const tarikh=Object.keys(j.data).sort().reverse();
  const jum={}; j.peristiwa.forEach(e=>jum[e]=tarikh.reduce((a,d)=>a+(j.data[d][e]||0),0));
  const t0=tarikh[0], hariIni=j.data[t0]||{};

  const kpi=[['buka_quiz','Buka quiz'],['quiz_habis','Habis quiz'],
             ['sunyi_catat','Kebaikan dicatat'],['buka_app','Buka app']];

  document.getElementById('hasil').innerHTML=`
    <div class="kpi">${kpi.map(([e,l])=>`
      <div class="k"><div class="n">${jum[e]||0}</div><div class="l">${l}</div>
        <div class="s">hari ni: ${hariIni[e]||0}</div></div>`).join('')}</div>

    <div class="card"><h3 style="margin:0 0 12px;font-size:16px">Corong quiz</h3>
      <div class="corong">
        <div class="s"><span>Buka quiz</span><b>${jum.buka_quiz||0}</b></div>
        <div class="s"><span>Tekan Mula <span class="pct">${pct(jum.quiz_mula,jum.buka_quiz)}</span></span><b>${jum.quiz_mula||0}</b></div>
        <div class="s"><span>Sampai bacaan <span class="pct">${pct(jum.quiz_habis,jum.buka_quiz)}</span></span><b>${jum.quiz_habis||0}</b></div>
      </div>
      <p class="note" style="margin-top:11px">Kalau ramai buka tapi sedikit tekan Mula — masalah pada muka depan.
      Kalau ramai tekan Mula tapi sedikit sampai bacaan — soalan terlalu panjang atau ada satu yang buat orang berhenti.</p>
    </div>

    <div class="card"><h3 style="margin:0 0 12px;font-size:16px">Catatan Sunyi</h3>
      <div class="corong">
        <div class="s"><span>Buka tab</span><b>${jum.sunyi_buka||0}</b></div>
        <div class="s"><span>Catat kebaikan <span class="pct">${pct(jum.sunyi_catat,jum.sunyi_buka)}</span></span><b>${jum.sunyi_catat||0}</b></div>
        <div class="s"><span>Refleksi mingguan</span><b>${jum.sunyi_minggu||0}</b></div>
      </div>
    </div>

    <div class="card"><h3 style="margin:0 0 12px;font-size:16px">Jumlah ${j.hari} hari</h3>
      <div class="bar">${j.peristiwa.map(e=>{
        const mak=Math.max(...j.peristiwa.map(x=>jum[x]||0),1);
        return `<div class="r"><span>${esc(NAMA[e]||e)}</span>
          <u style="width:${Math.round((jum[e]||0)/mak*100)}%"></u><b>${jum[e]||0}</b></div>`;}).join('')}</div>
    </div>

    <div class="card"><h3 style="margin:0 0 12px;font-size:16px">Ikut hari</h3>
      <div class="scroll"><table>
        <tr><th>Tarikh</th>${j.peristiwa.map(e=>`<th>${esc((NAMA[e]||e).split(' ')[0])}</th>`).join('')}</tr>
        ${tarikh.map(d=>`<tr><td>${esc(d)}</td>${j.peristiwa.map(e=>`<td>${j.data[d][e]||0}</td>`).join('')}</tr>`).join('')}
      </table></div>
    </div>

    <p class="note">Angka ini dikira daripada peristiwa yang direkod di server. Ia tidak menyimpan
    apa-apa maklumat tentang sesiapa — hanya tarikh dan jenis peristiwa.</p>`;
}
</script>
</body>
</html>
